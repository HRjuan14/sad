# /etc/krb5kdc/kdc.conf de SecureCorp (montado en el servidor). No hace falta tocarlo.
# Solo cifrados AES modernos y el log en /var/log/krb5kdc.log ("./lab.sh logs kerberos").
[kdcdefaults]
    kdc_ports = 88
    kdc_tcp_ports = 88

[realms]
    SECURECORP.LOCAL = {
        database_name = /var/lib/krb5kdc/principal
        admin_keytab = FILE:/etc/krb5kdc/kadm5.keytab
        acl_file = /etc/krb5kdc/kadm5.acl
        key_stash_file = /etc/krb5kdc/stash
        supported_enctypes = aes256-cts-hmac-sha384-192:normal aes128-cts-hmac-sha256-128:normal
        max_life = 10h 0m 0s
        max_renewable_life = 7d 0h 0m 0s
    }

[logging]
    kdc = FILE:/var/log/krb5kdc.log
