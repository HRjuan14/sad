# /etc/krb5.conf de SecureCorp (montado en servidor y cliente). No hace falta tocarlo.
# Las búsquedas DNS están desactivadas: sin eso, kinit se queda más de un minuto esperando.
[libdefaults]
    default_realm = SECURECORP.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    dns_uri_lookup = false
    ticket_lifetime = 10h
    renew_lifetime = 7d
    forwardable = true
    rdns = false

[realms]
    SECURECORP.LOCAL = {
        kdc = kdc.securecorp.local
        admin_server = kdc.securecorp.local
    }

[domain_realm]
    .securecorp.local = SECURECORP.LOCAL
    securecorp.local = SECURECORP.LOCAL
