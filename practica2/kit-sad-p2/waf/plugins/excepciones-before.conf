# Excepciones del WAF (se cargan ANTES de las reglas de OWASP) · bloque C · UD5.
# Después de cambiar algo:  ./lab.sh waf
#
# ✍️ C3 · El formulario /catas rechaza notas de cata normales de los clientes (un FALSO POSITIVO:
#         palabras como «select» o «union» en una nota de vino disparan la regla de inyección SQL).
#         Quita las reglas de inyección SQL (tag attack-sqli) SOLO para el campo «notas» y SOLO en /catas.
#         Nada más (si lo abres entero, dejas pasar inyecciones de verdad).
#         Pista:
#   SecRule REQUEST_URI "@beginsWith /catas" \
#       "id:1000001,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:notas"
