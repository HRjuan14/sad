#!/usr/sbin/nft -f
# ════════════════════════════════════════════════════════════════════════════════
#  BODEGAS ATLÁNTICO · la lista del vigilante (Práctica 2 de SAD)
#
#  Lo editas aquí, en tu ordenador, y lo cargas con:   ./lab.sh aplicar
#  Lo compruebas con:                                  ./lab.sh comprobar
#
#  👀 = ya está hecho: léelo y entiéndelo (te lo preguntarán en la defensa)
#  ✍️ = lo haces tú. Escribe tu regla JUSTO DEBAJO de cada ✍️ y no borres los comentarios.
#       Termina cada regla tuya con  comment "A2 · oficinas -> calle"  (para qué es): cuenta en la nota.
# ════════════════════════════════════════════════════════════════════════════════
flush ruleset

# 👀 Nombres, para no escribir IPs sueltas (en una regla: $TIENDA, $WAN…)
define WAN = "wan"   # la calle         · fw 198.51.100.254
define DMZ = "dmz"   # la tienda online · fw 172.16.20.254
define LAN = "lan"   # las oficinas     · fw 172.16.10.254
define VPN = "wg0"   # el pasadizo      · fw 10.66.0.1

define TIENDA    = 172.16.20.10   # web (80 y 443) y SSH (22)
define OFICINA   = 172.16.10.5    # PC de la oficina
define ERP       = 172.16.10.20   # ERP: intranet (8080) y base de datos del stock (5432)
define ENOLOGA   = 10.66.0.2      # la enóloga, por la VPN
define COMERCIAL = 10.66.0.3      # el comercial, por la VPN

table inet bodega {
    # 👀 input: quién puede hablar con el propio VIGILANTE. Ya está hecho.
    chain input {
        type filter hook input priority 0; policy drop;
        ct state invalid drop
        ct state established,related accept
        iif lo accept
        icmp type echo-request limit rate 5/second accept
        iifname $LAN tcp dport 22 accept comment "SSH al firewall, solo desde las oficinas"
        iifname $WAN udp dport 51820 accept comment "la puerta del pasadizo (bloque B)"
    }

    # forward: quién puede PASAR de una zona a otra. Lista blanca: lo que no esté aquí, fuera (policy drop).
    # Recuerda: se lee de arriba abajo y la PRIMERA regla que encaja, manda.
    chain forward {
        type filter hook forward priority 0; policy drop;

        # ══ BLOQUE A · el perímetro ══
        ct state invalid drop

        # ✍️ A1 · La memoria del vigilante: las respuestas a lo que ya salió, pasan.

        # ✍️ A2 · Las oficinas salen a la calle (a cualquier sitio).

        # ✍️ A3 · Las oficinas entran en la tienda: la web (80 y 443) y el SSH (22). Nada más.

        # ✍️ A4 · La calle entra en la tienda, pero SOLO a la web (80 y 443).

        # ✍️ A5 · La excepción: la tienda consulta el stock en el ERP, SOLO en el 5432.
        #         Piensa dónde va respecto a A6.

        # ✍️ A6 · La tienda NO entra en las oficinas. Con un contador (counter) para saber cuántas veces lo intenta.

        # ══ BLOQUE B · el teletrabajo ══
        # 👀 B · La enóloga llega al ERP, solo a la intranet (8080):
        iifname $VPN oifname $LAN ip saddr $ENOLOGA ip daddr $ERP tcp dport 8080 accept comment "B · enóloga -> ERP"

        # ✍️ B2 · El comercial llega al ERP, solo a la intranet (8080).

        # ✍️ B3 · El comercial administra la tienda por SSH (22). La enóloga, no.
    }
}

# La centralita (NAT)
table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat;
        # ✍️ A7 · Quien llama a la bodega (wan) a la web (80 y 443), a la tienda.
    }
    chain postrouting {
        type nat hook postrouting priority srcnat;
        # ✍️ A7 · Todo lo que sale a la calle, con la IP de la bodega.
    }
}
