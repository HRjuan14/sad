#!/usr/sbin/nft -f
# ════════════════════════════════════════════════════════════════════════════
#  BATERÍA GUIADA UD3 + UD4 · la lista del vigilante del edificio de clase
#  Lo editas aquí y lo cargas con:  ./lab.sh aplicar      Lo compruebas con:  ./lab.sh comprobar
#  👀 = hecho (léelo) · ✍️ = lo haces tú, JUSTO DEBAJO de cada ✍️
# ════════════════════════════════════════════════════════════════════════════
flush ruleset

define WAN = "wan"           # la calle     · firewall 203.0.113.254
define DMZ = "dmz"           # la tienda    · firewall 10.10.20.254
define LAN = "lan"           # las oficinas · firewall 10.10.10.254
define WEB = 10.10.20.10     # la web (en la tienda)

table inet filtro {
    # input: quién puede hablar con el propio VIGILANTE
    chain input {
        # ✍️ 1.1 · Lista blanca: cambia «accept» por «drop» en la línea de abajo
        type filter hook input priority 0; policy accept;
        iif lo accept                            # 👀 el vigilante se habla a sí mismo
        ct state established,related accept     # 👀 si lo empezó él, la respuesta vuelve

        # ✍️ 1.2 · SSH (tcp, puerto 22) al vigilante, SOLO desde las oficinas ($LAN)

        # ✍️ 1.3 · Ping al vigilante (icmp type echo-request)

        # ✍️ 5.2 · (bloque 5) La puerta del pasadizo: udp, puerto 51820, por la calle ($WAN)

    }

    # forward: quién puede PASAR de una zona a otra. Ya tiene lista blanca (policy drop).
    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept     # 👀 si saliste tú, vuelves
        iifname $LAN oifname $WAN accept         # 👀 las oficinas salen a la calle

        # ✍️ 2.1 · La calle entra en la web, SOLO 80 y 443   (pista: tcp dport { 80, 443 })

        # ✍️ 2.2 · Las oficinas administran la web por SSH (22)

        # ✍️ 2.3 · La tienda NO entra en las oficinas (drop)

        # ✍️ 5.3 · (bloque 5) Lo que sale del pasadizo ("wg0") puede ir a las oficinas

    }
}

# La centralita
table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat;
        # ✍️ 3.1 · Quien llama a la empresa (wan) a la web (80 y 443), a la tienda:  … dnat to $WEB

    }
    chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname $WAN masquerade                  # 👀 salir con la IP de la empresa
    }
}
